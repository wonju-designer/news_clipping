name: 뉴스 클리핑 (아이즈비전)

on:
  schedule:
    # 매일 아침 3회 예약(KST 07:50 / 08:10 / 08:30) — GitHub cron 지연 대비, 중복은 코드가 차단
    - cron: "50 22 * * *"
    - cron: "10 23 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:        # 수동 실행(테스트)용

jobs:
  clipping:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # dashboard.html·data/ 커밋을 위한 쓰기 권한
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 뉴스 클리핑 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          # 이메일 상단 '지난 소식 보기' 버튼 → GitHub Pages 대시보드 URL
          DASHBOARD_URL: "https://wonju-designer.github.io/news_clipping/"
          # 진단 모드: 검색어별 수집 건수를 로그에 출력하려면 아래 줄 주석 해제
          # DEBUG: "1"
          # 품질 AI를 Claude로 전환하려면 아래 3줄 주석 해제 + Secret에 ANTHROPIC_API_KEY 등록
          # QUALITY_AI: claude
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # CLAUDE_MODEL: claude-sonnet-5   # 저비용은 claude-haiku-4-5-20251001
          # 모델명 교체가 필요하면 아래 주석 해제 후 값 지정 (기본값이 최신이라 보통 불필요)
          # GROQ_MODEL: openai/gpt-oss-120b     # 대안: openai/gpt-oss-20b
          # GEMINI_MODEL: gemini-2.5-flash      # 대안: gemini-3.5-flash
        run: python main.py

      - name: 대시보드·데이터 커밋
        if: success()
        run: |
          git config user.name "news-clipping-bot"
          git config user.email "actions@github.com"
          git add -f docs/ data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋 생략"
          else
            git commit -m "대시보드 갱신: $(date +'%Y-%m-%d')"
            git push
          fi

      - name: 프리뷰 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report_preview
          path: report_preview.html
          if-no-files-found: ignore
