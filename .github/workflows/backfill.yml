name: 8월 백필 (월간 아카이브)

on:
  workflow_dispatch:            # 수동 실행 전용 (Actions 탭 → Run workflow)
    inputs:
      start:
        description: "수집 시작일 (YYYY-MM-DD)"
        required: false
        default: "2026-08-01"
      end:
        description: "수집 종료일 (YYYY-MM-DD, 비우면 오늘까지)"
        required: false
        default: ""

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # dashboard.html·data/ 커밋 권한
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 8월 백필 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end }}
        run: python backfill_august.py

      - name: 대시보드·데이터 커밋
        if: success()
        run: |
          git config user.name "news-clipping-bot"
          git config user.email "actions@github.com"
          git add -f docs/ data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋 생략"
          else
            git commit -m "8월 월간 아카이브 백필: $(date +'%Y-%m-%d')"
            git push
          fi
