const RECENT_LIMITS = {"per_section": 8, "by_section": {"industry": 15}, "per_company": 5};
const CATS = [["all","전체"],["industry","산업"],["own","자사"],["competitor","경쟁사"],["group","그룹"]];
let curDay = DATA.length ? DATA[0].date : null;
let curCat = "all";
let query = "";

const esc = s => (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 날짜 헬퍼(전역) — renderDays/renderDay 공용
const asDate = s => { const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
// 지난 소식 발행일 필터: 그날 + 전날 발행분까지 인정(매일 클리핑이 아침에 수집해 당일분이 적은 점 보완)
const _prevStr = ds => { const d=asDate(ds); if(!d) return ""; d.setDate(d.getDate()-1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const keepByPub = (a, ds) => { const ad=(a.date||""); return ad===ds || ad===_prevStr(ds); };

function renderDays(){
  // 최근 2일(오늘+어제)은 '매일 클리핑', 그보다 오래된 날짜는 '지난 소식'
  const RECENT_DAYS = 3;
  const today = new Date();
  const cutoff = new Date(today.getFullYear(), today.getMonth(), today.getDate() - (RECENT_DAYS - 1));
  // 날짜별 실제 표시 건수 계산 — 목록 숫자와 열었을 때 숫자를 일치
  const shownTotal = d=>{
    const dt = asDate(d.date);
    const isRec = dt ? dt >= cutoff : false;
    let n = 0;
    (d.sections||[]).forEach(s=>{
      if(!s.articles || !s.articles.length) return;
      if(s.subgroups && s.subgroups.length){
        s.subgroups.forEach(sg=>{
          let list = s.articles.filter(a=>a.subgroup===sg.id);
          // 지난 소식도 저장된 3일치를 그대로(발행일 필터 없음 — 매일 클리핑과 동일)
          if(isRec) list = list.slice(0, RECENT_LIMITS.per_company);
          n += list.length;
        });
      } else {
        let arts = s.articles;
        // 지난 소식도 저장된 3일치 그대로(발행일 필터 없음)
        if(isRec){
          const cap = (RECENT_LIMITS.by_section && RECENT_LIMITS.by_section[s.id]) || RECENT_LIMITS.per_section;
          arts = arts.slice(0, cap);
        }
        n += arts.length;
      }
    });
    return n;
  };
  const recent = [], older = [];
  DATA.forEach(d=>{
    const dt = asDate(d.date);
    (dt && dt >= cutoff ? recent : older).push(d);
  });
  const btn = d=>`<button class="daybtn ${d.date===curDay&&!query?'on':''}" onclick="pickDay('${d.date}')">
      <span>${esc(d.date)}</span><span class="cnt">${shownTotal(d)}건</span></button>`;
  let html = "";
  if(recent.length){
    html += `<div class="dgrp">매일 클리핑</div>` + recent.map(btn).join("");
  }
  if(older.length){
    html += `<div class="dgrp back">지난 소식</div>` + older.map(btn).join("");
  }
  document.getElementById("days").innerHTML = html || '<div class="hit">데이터 없음</div>';
}
function renderChips(){
  document.getElementById("chips").innerHTML = CATS.map(([id,nm])=>
    `<button class="chip ${curCat===id?'on':''}" onclick="pickCat('${id}')">${nm}</button>`).join("");
}
function pickDay(d){ curDay=d; query=""; document.getElementById("q").value=""; render(); }
function pickCat(c){ curCat=c; render(); }

function artHTML(a){
  const bdg = a.badge ? `<span class="bdg ${a.badge}">${a.badge}</span>` : "";
  const link = a.link ? `<a href="${esc(a.link)}" target="_blank">원문보기 ↗</a>` : "";
  return `<div class="art"><div class="at">${bdg}${esc(a.title)}</div>
    <div class="as">${esc(a.summary)}</div>
    <div class="am">${esc(a.press)} · ${esc(a.date)} ${link?'· '+link:''}</div></div>`;
}

function renderDay(){
  const d = DATA.find(x=>x.date===curDay);
  if(!d){ document.getElementById("view").innerHTML='<div class="empty">선택한 날짜 데이터가 없습니다.</div>'; return; }
  const headTitle = `${d.date} 뉴스 클리핑`;
  let h = `<div class="card"><div class="hd"><div class="d">${headTitle}</div></div>`;
  // 최근 2일(매일 클리핑)만 Top5·동향요약 노출, 지난 소식이면 숨김
  const _today = new Date();
  const _cutoff = new Date(_today.getFullYear(), _today.getMonth(), _today.getDate() - (3 - 1));
  const _m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d.date);
  const _dt = _m ? new Date(+_m[1], +_m[2]-1, +_m[3]) : null;
  const isRecent = _dt ? _dt >= _cutoff : false;
  if(isRecent && d.top5 && d.top5.length){
    h += `<div class="top5"><div class="lb">🔥 오늘의 핵심 Top 5</div>`;
    h += d.top5.map(t=>`<div class="row"><span class="n">${t.rank}</span>${
      t.link?`<a href="${esc(t.link)}" target="_blank" style="color:var(--t1);text-decoration:none">${esc(t.headline)}</a>`:esc(t.headline)
    } <span class="tag">[${esc(t.category)}]</span></div>`).join("");
    h += `</div>`;
  }
  d.sections.forEach(s=>{
    if(curCat!=="all" && s.id!==curCat) return;
    if(!s.articles.length) return;
    // 지난 소식도 매일 클리핑에서 보던 저장분(3일치)을 그대로 표시 — 발행일 필터 없음
    let secArts = s.articles;
    if(!secArts.length) return;
    // 표시 건수 계산(최근이면 상한 적용)
    let shownCount;
    if(s.subgroups && s.subgroups.length){
      // 계열사: 각 회사 상한(최근이면 회사당 per_company) 적용해 합산 — 실제 표시와 일치
      shownCount = 0;
      s.subgroups.forEach(sg=>{
        let list = secArts.filter(a=>a.subgroup===sg.id);
        if(isRecent) list = list.slice(0, RECENT_LIMITS.per_company);
        shownCount += list.length;
      });
    } else {
      shownCount = secArts.length;
      if(isRecent){
        const cap = (RECENT_LIMITS.by_section && RECENT_LIMITS.by_section[s.id]) || RECENT_LIMITS.per_section;
        shownCount = Math.min(shownCount, cap);
      }
    }
    h += `<div class="sec"><div class="sh">${s.num} ${esc(s.title)} · ${shownCount}건</div>`;
    if(s.subgroups && s.subgroups.length){
      // 회사별 소그룹 — 아코디언(기본 접힘). 번호 접두어가 남아있으면 제거
      s.subgroups.forEach(sg=>{
        let list = secArts.filter(a=>a.subgroup===sg.id);
        if(!list.length) return;
        // 자사(badge=자사) 기사를 먼저, 그다음 산업 — 각 그룹 내 원래 순서 유지
        list = [...list].sort((a,b)=>{
          const av = a.badge==="자사" ? 0 : 1;
          const bv = b.badge==="자사" ? 0 : 1;
          return av - bv;
        });
        // 최근(매일 кл리핑)이면 회사당 적게, 지난 소식이면 전체
        if(isRecent){ list = list.slice(0, RECENT_LIMITS.per_company); }
        const label = esc((sg.label||"").replace(/^\d+-\d+\s*/, ""));
        const dg = (isRecent && s.digest && typeof s.digest==="object") ? (s.digest[sg.id]||"") : "";
        h += `<details class="sg"><summary><span class="sgname">${label}</span>`+
             `<span class="sgcnt">${list.length}건</span></summary>`+
             `<div class="sgbody">`+
             (dg?`<div class="dg">${esc(dg)}</div>`:"")+
             list.map(artHTML).join("")+
             `</div></details>`;
      });
    } else {
      let arts = secArts;
      if(isRecent){
        const cap = (RECENT_LIMITS.by_section && RECENT_LIMITS.by_section[s.id]) || RECENT_LIMITS.per_section;
        arts = arts.slice(0, cap);
      }
      if(isRecent && s.digest && typeof s.digest==="string") h += `<div class="dg">${esc(s.digest)}</div>`;
      h += arts.map(artHTML).join("");
    }
    h += `</div>`;
  });
  h += `</div>`;
  document.getElementById("view").innerHTML = h;
}

function renderSearch(){
  const q = query.toLowerCase();
  let rows = [];
  DATA.forEach(d=>d.sections.forEach(s=>{
    if(curCat!=="all" && s.id!==curCat) return;
    s.articles.forEach(a=>{
      const hay = (a.title+" "+a.summary+" "+a.press).toLowerCase();
      if(hay.includes(q)) rows.push({d:d.date, s:s.title, a});
    });
  }));
  let h = `<div class="card"><div class="hd"><div class="d">검색 결과</div>
    <div class="m">"${esc(query)}" · ${rows.length}건</div></div><div class="sec">`;
  h += rows.length ? rows.map(r=>`<div class="art">
      <div class="at">${esc(r.a.title)} <span class="hit">${r.d} · ${esc(r.s)}</span></div>
      <div class="as">${esc(r.a.summary)}</div>
      <div class="am">${esc(r.a.press)} · ${esc(r.a.date)} ${r.a.link?'· <a href="'+esc(r.a.link)+'" target="_blank">원문보기 ↗</a>':''}</div>
    </div>`).join("") : '<div class="empty">일치하는 기사가 없습니다.</div>';
  h += `</div></div>`;
  document.getElementById("view").innerHTML = h;
}

function render(){
  renderDays(); renderChips();
  if(query.trim()) renderSearch(); else renderDay();
