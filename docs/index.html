const CATS = [["all","전체"],["industry","산업"],["own","자사"],["competitor","경쟁사"],["group","그룹"]];
let curDay = DATA.length ? DATA[0].date : null;

const esc = s => (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderDays(){
  // 최근 2일(오늘+어제)은 '매일 클리핑', 그보다 오래된 날짜는 '지난 소식'
  const RECENT_DAYS = 2;
  const today = new Date();
  const cutoff = new Date(today.getFullYear(), today.getMonth(), today.getDate() - (RECENT_DAYS - 1));
  const asDate = s => { const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
  const recent = [], older = [];
  DATA.forEach(d=>{
    const dt = asDate(d.date);
    (dt && dt >= cutoff ? recent : older).push(d);
  });
  const btn = d=>`<button class="daybtn ${d.date===curDay&&!query?'on':''}" onclick="pickDay('${d.date}')">
      <span>${esc(d.date)}</span><span class="cnt">${d.total}건</span></button>`;
  let html = "";
  if(recent.length){
    html += `<div class="dgrp">매일 클리핑</div>` + recent.map(btn).join("");
  }
  if(older.length){
    html += `<div class="dgrp back">지난 소식</div>` + older.map(btn).join("");
  }
  document.getElementById("days").innerHTML = html || '<div class="hit">데이터 없음</div>';
}

  const _cutoff = new Date(_today.getFullYear(), _today.getMonth(), _today.getDate() - (2 - 1));
  const _m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d.date);
  const _dt = _m ? new Date(+_m[1], +_m[2]-1, +_m[3]) : null;
  const isRecent = _dt ? _dt >= _cutoff : false;
  if(isRecent && d.top5 && d.top5.length){
    h += `<div class="top5"><div class="lb">🔥 오늘의 핵심 Top 5</div>`;
    h += d.top5.map(t=>`<div class="row"><span class="n">${t.rank}</span>${
      t.link?`<a href="${esc(t.link)}" target="_blank" style="color:var(--t1);text-decoration:none">${esc(t.headline)}</a>`:esc(t.headline)
    } <span class="tag">[${esc(t.category)}]</span></div>`).join("");
    h += `</div>`;
  }
  d.sections.forEach(s=>{
    if(curCat!=="all" && s.id!==curCat) return;
    if(!s.articles.length) return;
    h += `<div class="sec"><div class="sh">${s.num} ${esc(s.title)} · ${s.articles.length}건</div>`;
    if(s.subgroups && s.subgroups.length){
      // 회사별 소그룹 — 아코디언(기본 접힘). 번호 접두어가 남아있으면 제거
      s.subgroups.forEach(sg=>{
        let list = s.articles.filter(a=>a.subgroup===sg.id);
        if(!list.length) return;
        // 자사(badge=자사) 기사를 먼저, 그다음 산업 — 각 그룹 내 원래 순서 유지
        list = [...list].sort((a,b)=>{
          const av = a.badge==="자사" ? 0 : 1;
          const bv = b.badge==="자사" ? 0 : 1;
          return av - bv;
        });
        const label = esc((sg.label||"").replace(/^\d+-\d+\s*/, ""));
        const dg = (isRecent && s.digest && typeof s.digest==="object") ? (s.digest[sg.id]||"") : "";
        h += `<details class="sg"><summary><span class="sgname">${label}</span>`+
             `<span class="sgcnt">${list.length}건</span></summary>`+
             `<div class="sgbody">`+
             (dg?`<div class="dg">${esc(dg)}</div>`:"")+
             list.map(artHTML).join("")+
             `</div></details>`;
      });
    } else {
      if(isRecent && s.digest && typeof s.digest==="string") h += `<div class="dg">${esc(s.digest)}</div>`;
      h += s.articles.map(artHTML).join("");
    }
    h += `</div>`;
  });
  h += `</div>`;
  document.getElementById("view").innerHTML = h;
}

function renderSearch(){
  const q = query.toLowerCase();
  let rows = [];
  DATA.forEach(d=>d.sections.forEach(s=>{
    if(curCat!=="all" && s.id!==curCat) return;
    s.articles.forEach(a=>{
      const hay = (a.title+" "+a.summary+" "+a.press).toLowerCase();
      if(hay.includes(q)) rows.push({d:d.date, s:s.title, a});
    });
  }));
  let h = `<div class="card"><div class="hd"><div class="d">검색 결과</div>
    <div class="m">"${esc(query)}" · ${rows.length}건</div></div><div class="sec">`;
  h += rows.length ? rows.map(r=>`<div class="art">
      <div class="at">${esc(r.a.title)} <span class="hit">${r.d} · ${esc(r.s)}</span></div>
      <div class="as">${esc(r.a.summary)}</div>
      <div class="am">${esc(r.a.press)} · ${esc(r.a.date)} ${r.a.link?'· <a href="'+esc(r.a.link)+'" target="_blank">원문보기 ↗</a>':''}</div>
    </div>`).join("") : '<div class="empty">일치하는 기사가 없습니다.</div>';
  h += `</div></div>`;
  document.getElementById("view").innerHTML = h;
}

function render(){
  renderDays(); renderChips();
  if(query.trim()) renderSearch(); else renderDay();
}
document.getElementById("q").addEventListener("input", e=>{ query=e.target.value; render(); });
document.getElementById("hsub").textContent =
  DATA.length ? `${DATA.length}일치 아카이브 · 최신 ${DATA[0].date}` : "데이터 없음";
render();
</script>
</body></html>
